<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>अपनी तस्वीर शेयर करें | धर्माबांध</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f3ec;
  color:#173b2a;
}

.header{
  background:#174b32;
  color:#fff;
  padding:18px 20px;
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:700;
}

.lang button{
  border:0;
  padding:7px 11px;
  border-radius:20px;
  margin-left:3px;
  cursor:pointer;
}

.active{
  background:#fff;
  color:#174b32;
}

main{
  max-width:720px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:28px;
  box-shadow:0 12px 35px #173b2a18;
}

h1{
  margin:0 0 8px;
  font-size:32px;
}

.sub{
  color:#65766b;
  line-height:1.6;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}

input,
textarea{
  width:100%;
  border:1px solid #d5ddd7;
  border-radius:12px;
  padding:13px;
  font-size:16px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.file-box{
  border:2px dashed #9bb9a5;
  border-radius:15px;
  padding:20px;
  text-align:center;
  background:#f7faf7;
}

.preview{
  display:none;
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:15px;
  margin-top:15px;
  background:#eee;
}

.submit{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:24px;
  background:#174b32;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin-top:18px;
  padding:13px;
  border-radius:12px;
  line-height:1.5;
  display:none;
}

.success{
  background:#e5f5e9;
  color:#176132;
}

.error{
  background:#fde9e7;
  color:#9b241b;
}

.debug{
  margin-top:10px;
  font-size:12px;
  white-space:pre-wrap;
  word-break:break-word;
  background:#fff3f1;
  border:1px solid #f0c2bc;
  padding:10px;
  border-radius:8px;
  display:none;
}

.back{
  text-align:center;
  margin-top:20px;
}

.back a{
  color:#174b32;
  font-weight:700;
  text-decoration:none;
}

.small{
  font-size:13px;
  color:#738078;
  margin-top:10px;
}

@media(max-width:600px){
  main{
    margin:20px auto;
    padding:0 14px;
  }

  .card{
    padding:20px;
  }

  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      🌿 धर्माबांध
    </div>

    <div class="lang">
      <button id="hiBtn" class="active">
        हिन्दी
      </button>

      <button id="enBtn">
        English
      </button>
    </div>

  </div>
</header>

<main>

<section class="card">

<h1 id="title">
  अपनी तस्वीर शेयर करें
</h1>

<p class="sub" id="intro">
  अपने गाँव धर्माबांध की कोई खूबसूरत तस्वीर हमारे साथ साझा करें।
  आपकी तस्वीर समीक्षा के बाद वेबसाइट की गैलरी में दिखाई जा सकती है।
</p>

<form id="uploadForm">

<label>
  📸 तस्वीर चुनें
</label>

<div class="file-box">

<input
  id="photo"
  type="file"
  accept="image/jpeg,image/png,image/webp,image/gif"
  required
>

<div class="small">
  JPG, PNG, WEBP या GIF • अधिकतम 2 MB (2 MB से बड़ी तस्वीर अपलोड नहीं होगी)
</div>

<img
  id="preview"
  class="preview"
  alt="Selected photo preview"
>

</div>

<label>
  👤 आपका नाम
</label>

<input
  id="name"
  maxlength="100"
  required
  placeholder="अपना नाम लिखें"
>

<label>
  📝 तस्वीर के बारे में
</label>

<textarea
  id="caption"
  maxlength="500"
  placeholder="इस तस्वीर के बारे में कुछ लिखें (वैकल्पिक)"
></textarea>

<button
  class="submit"
  id="submitBtn"
  type="submit"
>
  📤 तस्वीर भेजें
</button>

<div
  id="success"
  class="msg success"
></div>

<div
  id="error"
  class="msg error"
></div>

<div
  id="debug"
  class="debug"
></div>

</form>

<div class="back">
  <a href="index.html">
    ← गाँव की वेबसाइट पर वापस जाएँ
  </a>
</div>

</section>

</main>

<script>

const SUPABASE_URL =
"https://oyznkdapiuytrvyudhef.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1XH7tv3LyF4kG_RJgPF_NQ_v48d8Nmv";

const BUCKET =
"user-uploads";

const form =
document.getElementById("uploadForm");

const photo =
document.getElementById("photo");

const preview =
document.getElementById("preview");

const btn =
document.getElementById("submitBtn");


function showError(msg,detail=""){

  document.getElementById("error").textContent =
  msg;

  document.getElementById("error").style.display =
  "block";

  document.getElementById("success").style.display =
  "none";

  if(detail){

    const d =
    document.getElementById("debug");

    d.textContent =
    detail;

    d.style.display =
    "block";

  }

}


function showSuccess(msg){

  document.getElementById("success").textContent =
  msg;

  document.getElementById("success").style.display =
  "block";

  document.getElementById("error").style.display =
  "none";

  document.getElementById("debug").style.display =
  "none";

}


photo.onchange = () => {

  const file =
  photo.files[0];

  if(!file){
    return;
  }

  if(file.size > 2 * 1024 * 1024){

    showError(
      "❌ तस्वीर 2 MB से बड़ी है। कृपया 2 MB या उससे छोटी तस्वीर चुनें और फिर दोबारा Upload करें।"
    );

    photo.value = "";

    return;
  }

  preview.src =
  URL.createObjectURL(file);

  preview.style.display =
  "block";

};


form.onsubmit = async (e) => {

  e.preventDefault();

  document.getElementById("error").style.display =
  "none";

  document.getElementById("debug").style.display =
  "none";

  const file =
  photo.files[0];

  const name =
  document.getElementById("name").value.trim();

  const caption =
  document.getElementById("caption").value.trim();

  if(!file || !name){

    showError(
      "❌ कृपया तस्वीर और अपना नाम भरें।"
    );

    return;
  }

  // Final 2 MB validation before upload
  if(file.size > 2 * 1024 * 1024){

    showError(
      "❌ तस्वीर 2 MB से बड़ी है। कृपया 2 MB या उससे छोटी तस्वीर चुनें और फिर दोबारा Upload करें।"
    );

    return;
  }

  btn.disabled =
  true;

  btn.textContent =
  "⏳ Uploading...";

  try{

    /*
      Create a safe filename
    */

    const safe =
    file.name
    .toLowerCase()
    .replace(/[^a-z0-9._-]/g,"-");

    const path =
    Date.now() + "-" + safe;


    /*
      SUPABASE STORAGE UPLOAD
    */

    const storageHeaders = {

      "apikey":
      SUPABASE_KEY,

      "Authorization":
      "Bearer " + SUPABASE_KEY,

      "Content-Type":
      file.type,

      "x-upsert":
      "false"

    };

    const storageResponse =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      encodeURIComponent(path),

      {
        method:"POST",

        headers:
        storageHeaders,

        body:file
      }

    );


    if(!storageResponse.ok){

      const text =
      await storageResponse.text();

      throw new Error(
        "STORAGE ERROR HTTP " +
        storageResponse.status +
        "\n" +
        text
      );

    }


    /*
      SAVE SUBMISSION IN DATABASE
      IMPORTANT:
      Save path in BOTH file_path and photo_path
    */

    const databaseResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/photo_submissions",

      {

        method:"POST",

        headers:{

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY,

          "Content-Type":
          "application/json",

          "Prefer":
          "return=minimal"

        },

        body:
        JSON.stringify({

          name:name,

          caption:caption,

          file_path:path,

          photo_path:path,

          status:"pending"

        })

      }

    );


    if(!databaseResponse.ok){

      const text =
      await databaseResponse.text();

      throw new Error(
        "DATABASE ERROR HTTP " +
        databaseResponse.status +
        "\n" +
        text
      );

    }


    /*
      SUCCESS
    */

    showSuccess(
      "✅ आपकी तस्वीर सफलतापूर्वक भेज दी गई है।"
    );

    form.reset();

    preview.style.display =
    "none";

  }

  catch(err){

    console.error(err);

    showError(

      "❌ Upload failed. नीचे exact error दिया गया है:",

      err.message

    );

  }

  finally{

    btn.disabled =
    false;

    btn.textContent =
    "📤 तस्वीर भेजें";

  }

};

</script>

</body>
</html>

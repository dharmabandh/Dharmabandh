<script>
const API = "https://api.github.com/repos/dharmabandh/Dharmabandh/contents/images";

const ROOT = [
  "dharmabandh-jharkhand-omkar-mahato.jpg.jpg",
  "dharmabandh-jharkhand-omkar-mahato.jpg"
];

const SLIDE_TIME = 4000;

let images = [];
let current = 0;
let timer = null;
let language = localStorage.getItem("dharmabandh-language") || "hi";

const slides = document.getElementById("slides");
const dots = document.getElementById("dots");
const gallery = document.getElementById("galleryGrid");

const langHi = document.getElementById("langHi");
const langEn = document.getElementById("langEn");

function setLanguage(lang) {
  language = lang === "en" ? "en" : "hi";

  document.documentElement.lang = language;

  document.querySelectorAll("[data-hi][data-en]").forEach(el => {
    el.textContent =
      language === "en" ? el.dataset.en : el.dataset.hi;
  });

  langHi.classList.toggle("active", language === "hi");
  langEn.classList.toggle("active", language === "en");

  localStorage.setItem("dharmabandh-language", language);
}

langHi.addEventListener("click", () => setLanguage("hi"));
langEn.addEventListener("click", () => setLanguage("en"));

setLanguage(language);


/* Create GitHub image URL */
function imageUrl(name) {
  return "https://raw.githubusercontent.com/dharmabandh/Dharmabandh/main/images/" +
    encodeURIComponent(name);
}


/* Remove duplicate URLs */
function unique(array) {
  return [...new Set(array)];
}


/* Check whether image actually exists */
function checkImage(src) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => resolve(src);

    img.onerror = () => resolve(null);

    img.src = src;
  });
}


/* Create slideshow slide */
function makeSlide(src, i) {

  const el = document.createElement("div");

  el.className =
    "slide" + (i === 0 ? " active" : "");

  const bg = document.createElement("div");

  bg.className = "slide-bg";

  bg.style.backgroundImage =
    `url("${src}")`;

  const im = document.createElement("img");

  im.src = src;

  im.alt =
    `Dharmabandh village photo ${i + 1}`;

  im.loading =
    i === 0 ? "eager" : "lazy";

  el.append(bg, im);

  return el;
}


/* Render slideshow */
function renderSlides() {

  slides.innerHTML = "";
  dots.innerHTML = "";

  current = 0;

  images.forEach((src, i) => {

    slides.appendChild(
      makeSlide(src, i)
    );

    const d =
      document.createElement("button");

    d.className =
      "dot" + (i === 0 ? " active" : "");

    d.setAttribute(
      "aria-label",
      `Slide ${i + 1}`
    );

    d.onclick = () => {
      showSlide(i);
      startTimer();
    };

    dots.appendChild(d);
  });

  if (images.length > 1) {
    startTimer();
  }
}


/* Show slide */
function showSlide(n) {

  if (!images.length) return;

  const els = slides.children;

  current =
    (n + images.length) %
    images.length;

  [...els].forEach((el, i) => {

    el.classList.toggle(
      "active",
      i === current
    );

  });

  [...dots.children].forEach((d, i) => {

    d.classList.toggle(
      "active",
      i === current
    );

  });
}


/* 4 second slideshow */
function startTimer() {

  clearInterval(timer);

  if (images.length > 1) {

    timer = setInterval(() => {

      showSlide(current + 1);

    }, SLIDE_TIME);

  }
}


/* Buttons */
document.getElementById("prevBtn").onclick = () => {

  showSlide(current - 1);

  startTimer();

};

document.getElementById("nextBtn").onclick = () => {

  showSlide(current + 1);

  startTimer();

};


/* Render gallery */
function renderGallery() {

  gallery.innerHTML = "";

  if (!images.length) {

    gallery.innerHTML =
      '<div class="gallery-empty" style="grid-column:1/-1">' +
      'No photos found.' +
      '</div>';

    return;
  }

  images.forEach((src, i) => {

    const item =
      document.createElement("div");

    item.className =
      "gallery-item";

    const im =
      document.createElement("img");

    im.src = src;

    im.alt =
      `Dharmabandh village memory photo ${i + 1}`;

    im.loading = "lazy";

    item.appendChild(im);

    item.onclick = () =>
      openLightbox(
        src,
        im.alt
      );

    gallery.appendChild(item);

  });

}


/* Load only valid GitHub images */
async function loadImages() {

  let found = [];

  try {

    const r = await fetch(API, {
      headers: {
        Accept:
          "application/vnd.github+json"
      }
    });

    if (r.ok) {

      const data = await r.json();

      found = data
        .filter(x =>
          x.type === "file" &&
          /\.(jpe?g|png|webp|gif)$/i.test(x.name)
        )
        .map(x => x.download_url);

    }

  } catch (e) {

    console.log(
      "GitHub image loading error:",
      e
    );

  }


  /* Add fallback images */
  const fallback =
    ROOT.map(imageUrl);


  /* Combine and remove duplicates */
  const candidates =
    unique([
      ...found,
      ...fallback
    ]);


  /*
    IMPORTANT:
    Check every image.
    Broken/deleted images are removed.
  */
  const checked =
    await Promise.all(
      candidates.map(checkImage)
    );


  images =
    checked.filter(Boolean);


  /* Render only working images */
  renderSlides();
  renderGallery();

}


/* Lightbox */
const lightbox =
  document.getElementById("lightbox");

const lightboxImg =
  document.getElementById("lightboxImg");


function openLightbox(src, alt) {

  lightboxImg.src = src;

  lightboxImg.alt = alt;

  lightbox.classList.add("open");

}


function closeLightbox() {

  lightbox.classList.remove("open");

  lightboxImg.src = "";

}


document.getElementById(
  "closeLightbox"
).onclick = closeLightbox;


lightbox.addEventListener(
  "click",
  e => {

    if (e.target === lightbox) {
      closeLightbox();
    }

  }
);


document.addEventListener(
  "keydown",
  e => {

    if (e.key === "Escape") {
      closeLightbox();
    }

  }
);


/* Mobile menu */
const menuBtn =
  document.getElementById("menuBtn");

const navLinks =
  document.getElementById("navLinks");

menuBtn.onclick = () =>
  navLinks.classList.toggle("open");

navLinks
  .querySelectorAll("a")
  .forEach(a => {

    a.onclick = () =>
      navLinks.classList.remove("open");

  });


/* Start */
loadImages();

</script>

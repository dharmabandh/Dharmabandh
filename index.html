  <style>
    :root {
      --green: #285943;
      --dark-green: #173d2c;
      --light-green: #edf5ef;
      --gold: #c79b45;
      --cream: #faf8f2;
      --text: #243129;
      --muted: #68736b;
      --white: #ffffff;
      --shadow: 0 12px 35px rgba(20, 50, 35, .10);
      --radius: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Noto Sans Devanagari",
        "Mangal",
        Arial,
        sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(40,89,67,.08);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      min-height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--dark-green);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      font-weight: 600;
      color: #405047;
    }

    .nav-links a {
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .menu-btn {
      display: none;
      background: none;
      border: 1px solid #ccd7d0;
      border-radius: 10px;
      font-size: 1.4rem;
      padding: 5px 10px;
      cursor: pointer;
      color: var(--dark-green);
    }

    /* HERO */
    .hero {
      height: 100vh;
      min-height: 620px;
      position: relative;
      overflow: hidden;
      background: #1d3025;
    }

    .slides {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.25),
          rgba(0,0,0,.12) 40%,
          rgba(0,0,0,.68)
        );
      z-index: 2;
    }

    .hero-content {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%);
      width: min(1000px, 90%);
      text-align: center;
      color: white;
    }

    .hero-content h1 {
      font-size: clamp(2.5rem, 7vw, 5.8rem);
      line-height: 1.15;
      font-weight: 900;
      text-shadow: 0 5px 25px rgba(0,0,0,.4);
      margin-bottom: 12px;
    }

    .hero-content p {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: .5px;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }

    .hero-controls {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .hero-arrow {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.6);
      background: rgba(0,0,0,.25);
      color: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      backdrop-filter: blur(5px);
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: white;
      transform: scale(1.35);
    }

    /* GENERAL */
    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1120px;
      margin: auto;
    }
